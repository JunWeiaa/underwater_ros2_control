# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 200  # ros2_control read/update/write loop Hz

    # Define the available controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    acados_nmpc_controller:
      type: acados_nmpc_controller/Acados_NMPC_Controller


imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"

acados_nmpc_controller:
  ros__parameters:
    update_rate: 200  # controller update/write Hz
    mpc:
      frequency: 200.0  # acados solve Hz
    manual:
      enforce_path_constraints: false
    debug:
      publish_observation: false
      observation_publish_rate: 20.0
    robot_pkg: "bluerov2_heavy"
    solver_id: "bluerov2_heavy"
    state_dim: 13
    input_dim: 8
    trajectory:
      source: "file"
      target_file: ""
      target_name: "figure8"
      path_frame: "odom"
      dt: 0.001
      prediction_dt: 0.025
      path_publish_dt: 0.025
      curr_path_publish_rate: 20.0
      horizon_steps: 20
      enable_topic_targets: true
      bspline_topic: "target_bspline"
      bspline_degree: 3
      bspline_duration: 0.0
      bspline_frame: "enu"
    joints:
      - thruster1_joint
      - thruster2_joint
      - thruster3_joint
      - thruster4_joint
      - thruster5_joint
      - thruster6_joint
      - thruster7_joint
      - thruster8_joint

    command_interfaces:
      # - effort
      # - velocity
      # - position
      - thrust

    state_interfaces: 
    # - effort
    # - position
    - velocity
      # - thrust

    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z
